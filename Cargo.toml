[package]
name = "the_unreliable_fellowship"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.19.0"
dioxus = { version = "0.7.9", features = ["fullstack"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "=0.2.118"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", optional = true, features = ["http1", "tokio"] }
dotenvy = { version = "0.15.7", optional = true }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1.52.3", optional = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "axum", "dotenvy", "reqwest", "tokio"]
